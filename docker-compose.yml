services:
  postgres:
    image: postgres:15-alpine
    container_name: devpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpulse_secret}
      POSTGRES_DB: ${POSTGRES_DB:-devpulse}
      TZ: Asia/Jakarta
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - devpulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devpulse} -d ${POSTGRES_DB:-devpulse}"]
      interval: 3s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devpulse-bot
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-devpulse}:${POSTGRES_PASSWORD:-devpulse_secret}@postgres:5432/${POSTGRES_DB:-devpulse}?sslmode=disable
      TIMEZONE: Asia/Jakarta
      BOT_MODE: ${BOT_MODE:-polling}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_PORT: 8090
      WEBHOOK_PATH: /webhook
    ports:
      - "${BOT_PORT:-8090}:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  devpulse_postgres_data:
